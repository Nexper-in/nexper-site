  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <text x="68" y="370" font-family="Arial Black,Arial,sans-serif" font-size="290" font-weight="900" fill="#FFFFFF" letter-spacing="-8">N</text>
  <text x="268" y="370" font-family="Arial Black,Arial,sans-serif" font-size="230" font-weight="900" fill="#FFC2F0">x</text>
